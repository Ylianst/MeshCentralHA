# yamllint disable rule:line-length
name: MeshCentral
version: "1.1.21-7"
slug: meshcentral
description: Open-source web-based remote computer management server.
url: https://github.com/Ylianst/MeshCentralHA/tree/main/meshcentral
webui: "https://[HOST]:[PORT:443]/"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
init: false
startup: application
boot: auto
hassio_api: false
homeassistant_api: false
host_network: false
ports:
  "443/tcp": 8443
  "80/tcp": 8080
ports_description:
  "443/tcp": HTTPS web UI and agent connections
  "80/tcp": HTTP redirect
map:
  - ssl:ro
options:
  server_title: MeshCentral
  external_https_port: 8443
  allow_new_accounts: true
  log_to_file: false
schema:
  server_title: str?
  external_https_port: int(1,65535)
  allow_new_accounts: bool
  log_to_file: bool
